name: Workbench demo

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/knowledge-workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototypes/knowledge-workbench/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --run
