<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">One account map, different decision contexts</title>
  <desc id="desc">A shared account evidence map is filtered by policy into a sales-rep view for the next customer conversation and a marketing view for campaign context. Both answers retain citations, freshness, and missing information.</desc>
  <defs>
    <linearGradient id="shared" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d3554"/>
      <stop offset="1" stop-color="#075a72"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000814" flood-opacity=".42"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#63d4e4"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#07162c"/>
  <text x="600" y="66" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#f4fbff">One account map. Different decision contexts.</text>
  <text x="600" y="103" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#b8d4e5">Shared knowledge stays useful when the answer follows the role and the decision.</text>

  <rect x="352" y="160" width="496" height="166" rx="22" fill="url(#shared)" filter="url(#shadow)"/>
  <circle cx="414" cy="221" r="27" fill="#8be4ee" opacity=".95"/>
  <path d="M401 222h26M414 209v26" stroke="#0d3554" stroke-width="4" stroke-linecap="round"/>
  <text x="464" y="216" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#fff">Shared account evidence</text>
  <text x="464" y="251" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#e5fbff">Dated sources · controlled facts · links</text>
  <text x="464" y="281" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#a9dce5">One account, not separate versions of the truth</text>

  <path d="M482 326 C430 380 320 368 276 410" fill="none" stroke="#207e9f" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M718 326 C770 380 880 368 924 410" fill="none" stroke="#207e9f" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="480" y="355" width="240" height="40" rx="20" fill="#103756"/>
  <text x="600" y="382" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#a5f1f5">Policy filters what is permitted</text>

  <rect x="72" y="420" width="420" height="195" rx="20" fill="#0d2947" stroke="#3b82a0" stroke-width="2" filter="url(#shadow)"/>
  <text x="112" y="468" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#f4fbff">Sales rep</text>
  <text x="112" y="503" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#63d4e4">Decision: next customer</text>
  <text x="112" y="530" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#63d4e4">conversation</text>
  <text x="112" y="566" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#b8d4e5">Commercial history · next step</text>
  <text x="112" y="592" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#b8d4e5">Deal risk</text>

  <rect x="708" y="420" width="420" height="195" rx="20" fill="#0d2947" stroke="#3b82a0" stroke-width="2" filter="url(#shadow)"/>
  <text x="748" y="468" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#f4fbff">Marketing</text>
  <text x="748" y="503" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#63d4e4">Decision: campaign context</text>
  <text x="748" y="548" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#b8d4e5">Approved summary · public signal</text>
  <text x="748" y="578" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#b8d4e5">Proof gap</text>

  <rect x="245" y="650" width="710" height="48" rx="24" fill="#103756"/>
  <text x="600" y="682" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#f4fbff">Every answer keeps its citations, freshness, and what is missing.</text>
</svg>
