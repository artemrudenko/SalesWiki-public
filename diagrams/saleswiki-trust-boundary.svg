<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Permissioned reads and governed changes</title>
  <desc id="desc">A request is identified and checked against policy. It produces either a cited answer from permitted evidence or an approved, auditable change.</desc>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e4266"/><stop offset="1" stop-color="#0b7b91"/></linearGradient>
    <linearGradient id="read" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#124463"/><stop offset="1" stop-color="#176b87"/></linearGradient>
    <linearGradient id="write" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#163a62"/><stop offset="1" stop-color="#36528a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000814" flood-opacity=".46"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6ee7f2"/></marker>
  </defs>
  <rect width="1600" height="1120" fill="#07162c"/>
  <text x="800" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" fill="#f4fbff">Permissioned reads. Governed changes.</text>
  <text x="800" y="103" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#b8d4e5">The same request never gets to choose its role or write directly to shared knowledge.</text>

  <g font-family="Arial, Helvetica, sans-serif" filter="url(#shadow)">
    <rect x="490" y="150" width="620" height="100" rx="22" fill="url(#top)"/>
    <text x="800" y="191" text-anchor="middle" font-size="29" font-weight="700" fill="#fff">User asks or proposes</text>
    <text x="800" y="223" text-anchor="middle" font-size="18" fill="#dffbff">A question and a correction start at the same boundary.</text>

    <rect x="490" y="300" width="620" height="94" rx="22" fill="#103756" stroke="#4cc9dc" stroke-width="2"/>
    <text x="800" y="338" text-anchor="middle" font-size="28" font-weight="700" fill="#f4fbff">Server-side identity</text>
    <text x="800" y="368" text-anchor="middle" font-size="18" fill="#b8d4e5">The client cannot choose a more privileged role.</text>

    <rect x="490" y="444" width="620" height="94" rx="22" fill="#103756" stroke="#4cc9dc" stroke-width="2"/>
    <text x="800" y="482" text-anchor="middle" font-size="28" font-weight="700" fill="#f4fbff">Role and account policy</text>
    <text x="800" y="512" text-anchor="middle" font-size="18" fill="#b8d4e5">Policy decides which evidence and actions are permitted.</text>

    <rect x="80" y="662" width="650" height="116" rx="22" fill="url(#read)" stroke="#4cc9dc" stroke-width="2"/>
    <text x="405" y="708" text-anchor="middle" font-size="29" font-weight="700" fill="#f4fbff">Access-filtered retrieval</text>
    <text x="405" y="743" text-anchor="middle" font-size="19" fill="#dffbff">Only allowed facts reach the answer path.</text>

    <rect x="80" y="858" width="650" height="116" rx="22" fill="url(#read)" stroke="#4cc9dc" stroke-width="2"/>
    <text x="405" y="904" text-anchor="middle" font-size="29" font-weight="700" fill="#f4fbff">Cited answer</text>
    <text x="405" y="939" text-anchor="middle" font-size="19" fill="#dffbff">Facts · sources · freshness · missing context</text>

    <rect x="870" y="662" width="650" height="116" rx="22" fill="url(#write)" stroke="#9bb7ff" stroke-width="2"/>
    <text x="1195" y="708" text-anchor="middle" font-size="29" font-weight="700" fill="#f4fbff">Proposed correction</text>
    <text x="1195" y="743" text-anchor="middle" font-size="19" fill="#e2e9ff">A user can suggest a change, but cannot write the record.</text>

    <rect x="870" y="858" width="300" height="116" rx="22" fill="url(#write)" stroke="#9bb7ff" stroke-width="2"/>
    <text x="1020" y="904" text-anchor="middle" font-size="25" font-weight="700" fill="#f4fbff">Curator review</text>
    <text x="1020" y="939" text-anchor="middle" font-size="17" fill="#e2e9ff">Approve or reject.</text>

    <rect x="1220" y="858" width="300" height="116" rx="22" fill="url(#write)" stroke="#9bb7ff" stroke-width="2"/>
    <text x="1370" y="904" text-anchor="middle" font-size="25" font-weight="700" fill="#f4fbff">Single writer</text>
    <text x="1370" y="939" text-anchor="middle" font-size="17" fill="#e2e9ff">Applies approved work.</text>

    <rect x="870" y="1015" width="650" height="74" rx="22" fill="#123b61" stroke="#6ee7f2" stroke-width="2"/>
    <text x="1195" y="1047" text-anchor="middle" font-size="22" font-weight="700" fill="#f4fbff">Transactional update · audit trail</text>
    <text x="1195" y="1073" text-anchor="middle" font-size="16" fill="#b8d4e5">Approved changes are applied safely and remain visible.</text>
  </g>

  <text x="800" y="601" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#a5f1f5">Policy creates two paths with different safety guarantees.</text>
  <g fill="none" stroke="#6ee7f2" stroke-width="5" marker-end="url(#arrow)">
    <path d="M800 250 L800 300"/>
    <path d="M800 394 L800 444"/>
    <path d="M650 538 C585 580 405 580 405 662"/>
    <path d="M950 538 C1015 580 1195 580 1195 662"/>
    <path d="M405 778 L405 858"/>
    <path d="M1195 778 L1195 818 L1020 818 L1020 858"/>
    <path d="M1170 916 L1220 916"/>
    <path d="M1370 974 L1370 1015"/>
  </g>
</svg>
