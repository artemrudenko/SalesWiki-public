<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1020" viewBox="0 0 800 1020" role="img" aria-labelledby="title desc">
  <title id="title">Keep the public demo and real pilot in separate data spaces</title>
  <desc id="desc">The public repository contains platform files and synthetic demo cards. Real customer data stays in a separate private vault. A health check rejects pilot data in the public repository.</desc>
  <rect width="800" height="1020" rx="28" fill="#07162c"/>
  <text x="48" y="72" fill="#f5f9ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">Before real data enters a pilot</text>
  <text x="48" y="115" fill="#b8cce2" font-family="Arial, sans-serif" font-size="27">Keep the public demo and private work apart.</text>

  <rect x="48" y="158" width="704" height="342" rx="22" fill="#10334a" stroke="#54d5df" stroke-width="3"/>
  <text x="80" y="214" fill="#82ebf0" font-family="Arial, sans-serif" font-size="30" font-weight="700">PUBLIC REPOSITORY</text>
  <rect x="80" y="244" width="640" height="100" rx="14" fill="#16475b"/>
  <text x="105" y="285" fill="#f5f9ff" font-family="Arial, sans-serif" font-size="30" font-weight="700">Platform</text>
  <text x="105" y="322" fill="#d8e9f2" font-family="Arial, sans-serif" font-size="26">Code, schemas, templates and docs</text>
  <rect x="80" y="365" width="640" height="104" rx="14" fill="#16475b"/>
  <text x="105" y="407" fill="#f5f9ff" font-family="Arial, sans-serif" font-size="30" font-weight="700">Synthetic demo</text>
  <text x="105" y="445" fill="#d8e9f2" font-family="Arial, sans-serif" font-size="26">Invented accounts only</text>

  <path d="M400 509 V533" fill="none" stroke="#7897af" stroke-width="4" stroke-dasharray="9 9"/>
  <rect x="48" y="544" width="704" height="264" rx="22" fill="#172b50" stroke="#99b7ff" stroke-width="3"/>
  <text x="80" y="600" fill="#bdcbff" font-family="Arial, sans-serif" font-size="30" font-weight="700">PRIVATE PILOT</text>
  <rect x="80" y="628" width="640" height="148" rx="14" fill="#213a65"/>
  <text x="105" y="675" fill="#f5f9ff" font-family="Arial, sans-serif" font-size="30" font-weight="700">Separate vault</text>
  <text x="105" y="713" fill="#e0e8ff" font-family="Arial, sans-serif" font-size="26">Real accounts, deals and contacts</text>
  <text x="105" y="750" fill="#e0e8ff" font-family="Arial, sans-serif" font-size="26">Approved access rules</text>

  <rect x="48" y="840" width="704" height="132" rx="18" fill="#0d3344" stroke="#37798a" stroke-width="2"/>
  <circle cx="88" cy="890" r="15" fill="#55d8db"/>
  <text x="122" y="891" fill="#e6f6f6" font-family="Arial, sans-serif" font-size="28" font-weight="700">Guardrail</text>
  <text x="80" y="938" fill="#e6f6f6" font-family="Arial, sans-serif" font-size="25">Health check rejects pilot data in the public repo.</text>
</svg>
